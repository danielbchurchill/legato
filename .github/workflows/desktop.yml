name: desktop

# Issue #129: the desktop app for every platform a release ships, each
# carrying its own target's legato-server, ffmpeg and fpcalc, with the
# Tauri updater's artifacts and a latest.json. One reusable workflow, so the
# build a pull request checks (build.yml) is the one a tag ships
# (release.yml).
#
#   macOS arm64 and x64  .app in a .dmg, plus the updater's .app.tar.gz.
#                        Both build on an Apple Silicon runner; the Intel app
#                        is cross-compiled (--target x86_64-apple-darwin, and
#                        Bun's own cross-compile for the sidecar), so it's a
#                        native x86_64 build. GitHub calls macos-15-intel its
#                        last Intel image, retired in August 2027, and Apple
#                        Silicon runners are the faster ones until then too.
#   Windows x64          the NSIS installer, which updates itself. Unsigned
#                        until #483.
#   Linux x64 and arm64  .deb and AppImage. The AppImage updates itself; a
#                        .deb belongs to its package manager, so the app
#                        links to the release instead. Both keep the server
#                        in usr/libexec/legato/, out of linuxdeploy's reach
#                        (scripts/desktop-release.mjs, stage). Built on Ubuntu 24.04
#                        (glibc 2.39) rather than ubuntu-latest, which moves
#                        to 26.04, so a new runner image doesn't quietly
#                        raise the oldest Linux that can run the app.
#
# macOS signing (#129, D20): one self-signed certificate keeps the app's
# identity, and with it the Local Network permission, the same from build
# to build. #483 swaps that certificate for a Developer ID one and adds
# notarization, through Tauri's own APPLE_ID/APPLE_TEAM_ID variables;
# nothing else here changes. The secrets live in the desktop-signing
# environment:
#   APPLE_CERTIFICATE           the .p12, base64
#   APPLE_CERTIFICATE_PASSWORD  its export password
#   APPLE_SIGNING_IDENTITY      the certificate's common name
#   TAURI_SIGNING_PRIVATE_KEY   the updater's private key (tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# A tag build without them fails. Any other build carries on without: the
# .app is unsigned, and the updater artifacts are signed with a key made for
# that run, so the manifest step still runs end to end. Each says so in a
# notice on the run.
on:
  workflow_call:
    inputs:
      version:
        description: The release's version, the tag without its v. Empty keeps tauri.conf.json's 0.0.0, which never updates itself.
        type: string
        default: ''
      release:
        description: A tag build. Every signing secret has to be set, or it fails rather than ship anything unsigned.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ffmpeg and fpcalc for all five targets, fetched once and handed to each
  # bundle job. The sources are the server release's
  # (scripts/fetch-release-media-binaries.mjs), which cover Linux too and
  # pin the Intel Mac's ffmpeg by hash.
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: fetch ffmpeg + fpcalc for all five targets
        run: node scripts/fetch-release-media-binaries.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-binaries
          path: |
            server/dist/*/ffmpeg*
            server/dist/*/fpcalc*
            server/dist/MEDIA-BINARIES.sha256
          if-no-files-found: error
          retention-days: 1

  bundle:
    name: bundle (${{ matrix.name }})
    needs: media
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    # Secrets and variables only: no deployment record on every pull request.
    environment:
      name: desktop-signing
      deployment: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (branch HEAD, 2026-08-05)
        with:
          targets: ${{ matrix.target }}

      - name: cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: 'src-tauri -> target'
          key: ${{ matrix.target }}

      # Tauri's Linux prerequisites, plus libasound2-dev for cpal/rodio
      # (src-tauri/src/playback.rs), as build.yml had them, and xvfb for
      # starting the packaged app below.
      - name: install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            xvfb

      - name: install root dependencies
        run: npm ci

      - name: install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: install server dependencies
        run: npm --prefix server ci

      # Which keys this run has. A tag needs all of them; anything else
      # carries on without and says so.
      - name: signing keys
        id: keys
        env:
          RELEASE: ${{ inputs.release }}
          MACOS: ${{ runner.os == 'macOS' }}
          HAVE_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAVE_UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$MACOS" = true ] && [ "$HAVE_APPLE" != true ]; then
            if [ "$RELEASE" = true ]; then
              echo "::error title=No macOS signing certificate::APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY must all be set in the desktop-signing environment to release. Refusing to ship an unsigned Mac app."
              exit 1
            fi
            echo "::notice title=macOS signing skipped::APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY aren't all set for this run (they live in the desktop-signing environment, and a fork's or Dependabot's pull request never gets them). This build's .app is unsigned."
            echo "macos=false" >> "$GITHUB_OUTPUT"
          else
            echo "macos=$MACOS" >> "$GITHUB_OUTPUT"
          fi
          if [ "$HAVE_UPDATER" != true ]; then
            if [ "$RELEASE" = true ]; then
              echo "::error title=No updater key::TAURI_SIGNING_PRIVATE_KEY must be set in the desktop-signing environment to release. Without it no update can be signed."
              exit 1
            fi
            echo "::notice title=Throwaway updater key::TAURI_SIGNING_PRIVATE_KEY isn't set for this run, so the updater artifacts are signed with a key made for this run only. No installed app would accept them."
            echo "updater=throwaway" >> "$GITHUB_OUTPUT"
          else
            echo "updater=release" >> "$GITHUB_OUTPUT"
          fi

      # Into a keychain of this run's own. Tauri's own APPLE_CERTIFICATE
      # import only recognises Apple-issued certificates (it looks for
      # "Developer ID Application:" and the like, and a team ID), so the
      # .p12 is imported here and Tauri gets only APPLE_SIGNING_IDENTITY.
      # APPLE_CERTIFICATE never reaches the build step's environment.
      - name: import the signing certificate
        if: steps.keys.outputs.macos == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/legato-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Ahead of the runner's own keychains, which stay in the list. Their
          # paths have no spaces, so splitting the list on whitespace is safe.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate isn't trusted, so it's listed without -v.
          security find-identity -p codesigning "$keychain"
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" "$keychain" > /dev/null || {
            echo "::error::APPLE_SIGNING_IDENTITY doesn't name the certificate in APPLE_CERTIFICATE"
            exit 1
          }

      - name: throwaway updater key
        if: steps.keys.outputs.updater == 'throwaway'
        run: |
          password="$(openssl rand -hex 24)"
          npx tauri signer generate --ci -p "$password" -w "$RUNNER_TEMP/updater.key" > /dev/null
          echo "::add-mask::$(cat "$RUNNER_TEMP/updater.key")"
          {
            echo "THROWAWAY_UPDATER_KEY=$(cat "$RUNNER_TEMP/updater.key")"
            echo "THROWAWAY_UPDATER_PASSWORD=$password"
            echo "THROWAWAY_UPDATER_PUBKEY=$(cat "$RUNNER_TEMP/updater.key.pub")"
          } >> "$GITHUB_ENV"

      - name: build the server sidecar
        env:
          LEGATO_RELEASE_VERSION: ${{ inputs.version }}
          LEGATO_RELEASE_GIT_SHA: ${{ inputs.release && github.sha || '' }}
        run: node scripts/build-server-sidecar.mjs --target ${{ matrix.target }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: media-binaries
          path: server/dist

      # This target's ffmpeg and fpcalc into the bundle's resources, the
      # sidecar and both of them signed on macOS, and the tauri.conf.json
      # patch for this build.
      - name: stage this target's binaries
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.keys.outputs.macos == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          VERSION: ${{ inputs.version }}
          PUBKEY: ${{ env.THROWAWAY_UPDATER_PUBKEY }}
        run: |
          node scripts/desktop-release.mjs stage --target ${{ matrix.target }} \
            --config-out "$RUNNER_TEMP/tauri.release.json" \
            ${VERSION:+--version "$VERSION"} ${PUBKEY:+--pubkey "$PUBKEY"}
          cat "$RUNNER_TEMP/tauri.release.json"

      - name: cargo clippy (src-tauri)
        working-directory: src-tauri
        run: cargo clippy --target ${{ matrix.target }} --all-targets --all-features -- -D warnings

      - name: build the app
        env:
          SIGNING_IDENTITY: ${{ steps.keys.outputs.macos == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || env.THROWAWAY_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || env.THROWAWAY_UPDATER_PASSWORD }}
        run: |
          # Set only when signing: Tauri treats an empty APPLE_SIGNING_IDENTITY
          # as an identity named "" and fails to sign with it.
          if [ -n "$SIGNING_IDENTITY" ]; then export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"; fi
          npx tauri build --ci --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} \
            --config "$RUNNER_TEMP/tauri.release.json"

      # What's inside each bundle, its architecture, and on macOS its
      # signature.
      - name: check the bundle
        run: node scripts/desktop-release.mjs verify --target ${{ matrix.target }} ${{ steps.keys.outputs.macos == 'true' && '--signed' || '' }}

      # The Intel app's server runs under Rosetta here.
      - name: install Rosetta
        if: matrix.target == 'x86_64-apple-darwin'
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license

      # The sidecar the bundle carries boots against an empty data dir and
      # applies every migration. On macOS that's the copy inside the .app,
      # under the hardened runtime when signed.
      - name: the bundled server boots
        run: |
          case "${{ runner.os }}" in
            macOS) sidecar="src-tauri/target/${{ matrix.target }}/release/bundle/macos/legato.app/Contents/MacOS/legato-server" ;;
            Windows) sidecar="src-tauri/binaries/legato-server-${{ matrix.target }}.exe" ;;
            *) sidecar="src-tauri/binaries/legato-server-${{ matrix.target }}" ;;
          esac
          # Relative to server/, where npm --prefix runs it. Windows' bash
          # would hand Bun a /d/a/... path it can't spawn.
          npm --prefix server run check:migration-boot -- "../$sidecar"

      # The packaged app itself: it starts its own server on 8899 and hands
      # it the bundle's own ffmpeg and fpcalc, and the server goes when the
      # app quits. On macOS, signed, that's the hardened runtime at work.
      # Not on Windows, where nothing reads another process's environment
      # without a tool of its own; the installer's contents are checked above.
      - name: the app starts its own server
        if: runner.os != 'Windows'
        run: node scripts/desktop-release.mjs launch --target ${{ matrix.target }}

      - name: collect the bundles
        run: node scripts/desktop-release.mjs collect --target ${{ matrix.target }} --out dist-desktop

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: dist-desktop/
          if-no-files-found: error
          retention-days: 14

  # latest.json, from every target's update and signature. On a tag,
  # release.yml uploads it after the bundles it names.
  manifest:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist-desktop

      - name: write latest.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION:-$(node -p "require('./src-tauri/tauri.conf.json').version")}"
          node scripts/desktop-release.mjs manifest --dir dist-desktop --version "$version"
          cat dist-desktop/latest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-manifest
          path: dist-desktop/latest.json
          if-no-files-found: error
          retention-days: 14
