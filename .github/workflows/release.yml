name: release

# Issue #102: publishes a real GitHub Release on every version tag push —
# five bun-compiled server binaries (linux-x64-baseline, linux-arm64,
# darwin-arm64, darwin-x64-baseline, windows-x64-baseline), each bundled
# with a matching ffmpeg + fpcalc into its own archive, plus one
# SHA256SUMS covering all of them. Everything builds on a single
# ubuntu-latest runner via Bun's cross-compilation
# (`bun build --compile --target=bun-<os>-<arch>`, see
# server/scripts/compile.ts) rather than a platform build matrix —
# unlike build.yml's real Tauri/native compiles, there's no per-OS
# toolchain dependency here to force macOS/Windows runners, and those bill
# against GitHub's included-minutes quota at 10x/2x the Linux rate (see
# build.yml's own comment on this).
#
# Scope note: switching Tauri's embedded server over to this compiled
# binary is issue #103, not this workflow — nothing here touches
# src-tauri/ or changes how `npx tauri dev` runs, and this workflow only
# ever runs on a real version tag push, never on an ordinary commit.
#
# Issue #105 adds the second job, `docker`: the same tag also publishes the
# multi-arch server image (linux/amd64 + linux/arm64) to GHCR, built from
# server/Dockerfile. See docs/install/docker.md for the user side.
#
# Issue #109 adds the third, `homebrew`: it opens a PR against the Homebrew
# tap that bumps the formula to this release. It is off until the tap
# repository exists; see that job's comment for how to turn it on.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # server/ runs on Bun (issue #100) — `bun build --compile` is what
      # actually produces the five binaries below; Node above is only for
      # `npm ci` (server/package-lock.json stays the dependency source of
      # truth, same reasoning as check.yml) and this workflow's own
      # plain-Node packaging scripts.
      - name: install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # The compile step runs the root `npm run build` to embed the web
      # client in every binary (issue #116), so it needs root deps too.
      - name: install root dependencies
        run: npm ci

      - name: install server dependencies
        run: npm --prefix server ci

      # v1.2.3 -> 1.2.3 — legato-server --version and every archive/asset
      # name below use this, not the raw tag.
      - name: resolve release version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: compile all five server targets
        run: npm --prefix server run compile
        env:
          LEGATO_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          LEGATO_RELEASE_GIT_SHA: ${{ github.sha }}

      # Issue #102's named risk: a compiled binary has no source tree, so a
      # broken or stale embed (server/src/migrations/manifest.generated.ts)
      # would boot clean and just silently have no schema. This is the
      # release-time gate on top of check.yml's identical per-PR copy of
      # the same check — see server/scripts/check-migration-boot.ts.
      - name: migration boot check (compiled linux-x64-baseline binary, empty data dir)
        run: npm --prefix server run check:migration-boot -- dist/linux-x64-baseline/legato-server

      - name: fetch ffmpeg + fpcalc for all five targets
        run: node scripts/fetch-release-media-binaries.mjs

      - name: package per-target archives + SHA256SUMS
        run: node scripts/package-release.mjs "${{ steps.version.outputs.value }}"

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist-release/*.tar.gz dist-release/*.zip dist-release/SHA256SUMS

  docker:
    # After `release`, not beside it: that job's migration boot check is the
    # gate against a binary with no schema, and the image ships that exact
    # binary shape. A tag that fails it shouldn't get an image either.
    needs: release
    runs-on: ubuntu-latest
    # Only this job writes packages. `release` keeps contents: write from
    # the top-level block and never gets a token that can push images.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU only runs the foreign-arch half of the runtime stage (apt-get,
      # useradd). The compile stage runs natively and cross-compiles through
      # Bun, see server/Dockerfile.
      - name: set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> :1.2.3, :1.2 and :latest. docs/install/docker-compose.yml
      # pulls :latest; pinning a version means editing that one tag.
      - name: image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/legato-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          file: server/Dockerfile
          # The web client's sources, for the Dockerfile's web stage (#116).
          build-contexts: |
            client=.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same version and SHA the release archives were compiled with, so
          # `legato-server --version` inside the image matches them.
          # meta's version is the tag without its v, like the release job's
          # own "resolve release version from tag" step.
          build-args: |
            LEGATO_VERSION=${{ steps.meta.outputs.version }}
            LEGATO_GIT_SHA=${{ github.sha }}

  homebrew:
    # After `release`, because the formula's sha256s come from the
    # SHA256SUMS that job publishes. Reading the published asset, rather
    # than rebuilding it here, means the checksums are those of the exact
    # files brew will download.
    needs: release
    # Off until danielbchurchill/homebrew-legato exists. To turn it on:
    #   1. Move packaging/homebrew/legato.rb to Formula/legato.rb in the tap
    #      (packaging/homebrew/README.md has the steps).
    #   2. Create a fine-grained token with Contents and Pull requests
    #      read/write on the tap only, and add it as this repo's Actions
    #      secret HOMEBREW_TAP_TOKEN.
    #   3. Add the Actions variable HOMEBREW_TAP_REPO, set to
    #      danielbchurchill/homebrew-legato.
    # With the variable unset this job is skipped, not failed, so tag pushes
    # before then stay green. Pre-release tags (v1.0.0-rc.1) never bump the
    # formula: `brew upgrade` would hand them to everyone.
    if: vars.HOMEBREW_TAP_REPO != '' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: resolve release version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: download this release's SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir "$RUNNER_TEMP"

      - name: check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: bump Formula/legato.rb
        run: node scripts/bump-homebrew-formula.mjs tap/Formula/legato.rb "${{ steps.version.outputs.value }}" "$RUNNER_TEMP/SHA256SUMS"

      # A PR rather than a push to the tap's main, so a bad bump can be
      # caught by the tap's own `brew test-bot` (or by eye) before any
      # `brew upgrade` sees it.
      - name: open a PR against the tap
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
        run: |
          branch="legato-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "legato $VERSION"
          git push origin "$branch"
          gh pr create --repo "$TAP_REPO" --head "$branch" \
            --title "legato $VERSION" \
            --body "Bumps legato to $VERSION, from ${{ github.server_url }}/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME. Opened by release.yml's homebrew job."
