name: spawn-loop

# TEMPORARY (#491): runs the server specs that spawn children with spawnSync
# in a loop under `bun test --isolate`, on Bun 1.4.2 and on 1.4.4, to show on
# the runner what the check job's hangs were and that 1.4.4 doesn't have
# them. Removed before the PR is marked ready; its run IDs stay in the PR.
on:
  push:
    branches: [danielbchurchill/fix-bun-spawnsync-hang]

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Third run: 1.4.4 alone, on the branch with the tunnel spec's bounded
    # close wait, to show it passes on the runner. (The second run had
    # 1.4.2, 1.4.3 and 1.4.4, 90 rounds of these specs and 14 of the suite.)
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.4.4']
        suite: [spawn-a, spawn-b, full]
    env:
      ROUNDS: ${{ matrix.suite == 'full' && 14 || 45 }}
      LIMIT: ${{ matrix.suite == 'full' && 300 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: install ffmpeg
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - name: install server dependencies
        run: npm --prefix server ci

      - name: ${{ matrix.suite }}, ${{ env.ROUNDS }} rounds
        working-directory: server
        run: |
          bun --version
          if [ "${{ matrix.suite }}" = full ]; then
            specs=""; echo "the whole server suite"
          else
            specs=$(grep -rln "test-ffmpeg\|spawnSync" src --include=*.spec.ts | sort)
            echo "$(echo "$specs" | wc -l) spec files:"; echo "$specs"
          fi
          mkdir -p ../loop-logs
          hung=0; failed=0; passed=0; rows=""
          for round in $(seq 1 "$ROUNDS"); do
            log=../loop-logs/round-$round.log
            start=$(date +%s)
            set +e
            timeout -k 10 "$LIMIT" bun test --isolate $specs > "$log" 2>&1
            status=$?
            set -e
            took=$(( $(date +%s) - start ))
            # The last file header bun test printed is the file it was in.
            # (On Actions it's wrapped in ##[group].)
            last=$(grep -oE 'src/[^ ]*\.spec\.ts:$' "$log" | tail -n 1 | tr -d ':')
            if [ "$status" = 124 ] || [ "$status" = 137 ]; then
              hung=$((hung + 1)); result="HUNG in $last"
              echo "::group::round $round hung ($took s, exit $status), last lines"; tail -n 25 "$log"; echo "::endgroup::"
            elif [ "$status" != 0 ]; then
              failed=$((failed + 1)); result="failed: $(grep '(fail)' "$log" | head -n 3 | tr '\n' ' ')"
              echo "::group::round $round failed ($took s, exit $status)"; grep -B2 -A12 '(fail)' "$log" | head -n 80; echo "::endgroup::"
            else
              passed=$((passed + 1)); result="passed"
            fi
            echo "round $round: exit $status, ${took}s, $result"
            rows="$rows| $round | $status | $took | $result |"$'\n'
          done
          summary="Bun $(bun --version), ${{ matrix.suite }}: $ROUNDS rounds, $hung hung, $failed failed, $passed passed"
          echo "$summary"
          { echo "### $summary"; echo; echo "| round | exit | seconds | result |"; echo "|---|---|---|---|"; printf '%s' "$rows"; } >> "$GITHUB_STEP_SUMMARY"
