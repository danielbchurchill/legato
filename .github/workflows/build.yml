name: build

# M10 step one: prove the Tauri shell actually builds and bundles clean on
# macOS and Windows, not just this Linux dev machine. What's deliberately
# deferred (ffmpeg/fpcalc bundling, code signing — none of that is this
# workflow's job).
#
# This is the expensive one — a real 3-platform compile + bundle via
# tauri-action, and macOS/Windows runners bill against GitHub's included-
# minutes quota at 10x/2x the Linux rate. So the 3-platform `build` only
# runs for commits that can change what gets compiled or bundled: Rust
# source, the frontend src/ the webview bundles, root deps, and server/.
# Since issue #103 the server ships *inside* the bundle as the
# `legato-server` sidecar (tauri.conf.json's bundle.externalBin), compiled
# by scripts/build-server-sidecar.mjs from beforeBuildCommand, so a
# server/-only change does alter what this job produces. relay/ and site/
# are separate deployables with their own coverage in check.yml.
#
# That scoping lives in the `changes` job, not in `on: paths`. A workflow
# skipped by a paths filter reports no checks at all, so a required check
# on `build` would leave a site/-only or docs-only PR waiting forever.
# Instead the workflow always starts, `build` is skipped when nothing
# relevant changed, and `build-result` always reports. Branch protection
# requires `build-result`, never the matrix job names.
#
# Force a full build regardless of what changed via workflow_dispatch
# (Actions tab -> build -> Run workflow, or `gh workflow run build.yml`).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides whether the expensive build is needed. Keep BUILD_PATHS in step
  # with the list in the header comment.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: diff against the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          BUILD_PATHS: '^(src-tauri/|src/|server/|package\.json$|package-lock\.json$|scripts/build-server-sidecar\.mjs$|\.github/workflows/build\.yml$)'
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BEFORE...$PUSH_AFTER" ;;
            *) range="" ;;
          esac
          # workflow_dispatch, or a push whose "before" isn't a commit we
          # have (all zeros for a new branch, or gone after a force push):
          # there's nothing trustworthy to diff against, so build everything.
          base="${range%%...*}"
          if [ -z "$range" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "no usable diff range; building"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$range")
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE "$BUILD_PATHS"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the bundle depends on changed; skipping build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # Cargo.toml pins rust-version = "1.77.2" as an MSRV floor, not an
      # exact toolchain version — stable is well above it and is what's
      # actually used on the dev machine (rustc 1.97.x), so stable is what
      # this respects rather than literally installing 1.77.2.
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (branch HEAD, 2026-08-05)

      - name: cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'src-tauri -> target'

      # Tauri's own Linux prerequisites (webkit2gtk, appindicator, rsvg,
      # patchelf for AppImage) plus libasound2-dev, which isn't in Tauri's
      # docs but is required to link cpal/rodio (src-tauri/src/playback.rs)
      # — this dev machine already has it installed, a fresh runner doesn't.
      # No ffmpeg here: that was only ever a server/ test-time dependency,
      # and server/'s test suite runs in check.yml now, not this job.
      - name: install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      # Root deps before server deps, and both before tauri-action: the
      # sidecar compile (server/scripts/compile.ts) runs the root
      # `npm run build` itself to embed the web client it serves at / (issue
      # #116), so it needs root node_modules as much as tauri's own
      # beforeBuildCommand does.
      - name: install root dependencies
        run: npm ci

      # beforeBuildCommand runs `npm run build:sidecar`, which compiles the
      # server with `bun build --compile` (issue #103). Same pinned Bun as
      # check.yml and release.yml; scripts/build-server-sidecar.mjs's
      # BUN_VERSION says to bump all three together.
      - name: install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: install server dependencies
        run: npm --prefix server ci

      # Has to come before clippy, not just before tauri-action:
      # tauri-build's build script checks every bundle.externalBin path
      # exists on *every* cargo invocation, so clippy on a fresh runner fails
      # with "resource path `binaries/legato-server-<triple>` doesn't exist"
      # otherwise. tauri-action's beforeBuildCommand compiles it again
      # (no --if-missing there), so the bundle still ships a fresh binary.
      - name: build server sidecar
        run: npm run build:sidecar

      - name: cargo clippy (src-tauri)
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      # No tagName/releaseId/releaseName: this deliberately does not create
      # or publish a GitHub Release (out of scope — see PR description).
      # uploadWorkflowArtifacts makes the unsigned bundle downloadable
      # straight from the Actions run instead.
      - name: build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          uploadWorkflowArtifacts: true

  # The one check branch protection requires from this workflow. It always
  # runs, so a PR that skipped the build still gets a result. It fails
  # closed: if `changes` itself broke, nothing was proven, so it fails.
  build-result:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: build passed or wasn't needed
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES, build: $BUILD"
          [ "$CHANGES" = success ] || { echo "the changes job didn't succeed"; exit 1; }
          case "$BUILD" in
            success|skipped) exit 0 ;;
            *) echo "build $BUILD"; exit 1 ;;
          esac
