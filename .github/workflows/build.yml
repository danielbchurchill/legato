name: build

# Proves the desktop app builds and bundles on every platform a release
# ships, with the release's own workflow: desktop.yml, which release.yml runs
# on each tag (#129). macOS arm64 and x64, Windows x64, and Linux x64 and
# arm64, each carrying its own target's server, ffmpeg and fpcalc, checked
# inside the bundle, with the sidecar booted from it. The bundles and their
# latest.json are this run's artifacts.
#
# Only main and release tags may use the desktop-signing environment's
# keys, so a pull request's Mac build is unsigned and its updater artifacts
# are signed with a key made for the run. It says so in two notices
# (desktop.yml's "signing keys" step). Signing is checked by this
# workflow's push build on main after each merge, signed exactly as a
# release is, and again by the tag.
#
# This is the expensive one, so it only runs for commits that can change
# what gets compiled or bundled: Rust source, the frontend src/ the webview
# bundles, root deps, server/ (the sidecar ships inside the bundle), and the
# scripts and workflow that build it. relay/ and site/ are separate
# deployables with their own coverage in check.yml.
#
# That scoping lives in the `changes` job, not in `on: paths`. A workflow
# skipped by a paths filter reports no checks at all, so a required check
# on `build` would leave a site/-only or docs-only PR waiting forever.
# Instead the workflow always starts, `build` is skipped when nothing
# relevant changed, and `build-result` always reports. Branch protection
# requires `build-result`, never the matrix job names.
#
# Force a full build regardless of what changed via workflow_dispatch
# (Actions tab -> build -> Run workflow, or `gh workflow run build.yml`).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides whether the expensive build is needed. Keep BUILD_PATHS in step
  # with the list in the header comment.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: diff against the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          BUILD_PATHS: '^(src-tauri/|src/|server/|package\.json$|package-lock\.json$|scripts/build-server-sidecar\.mjs$|scripts/desktop-release\.mjs$|scripts/fetch-release-media-binaries\.mjs$|\.github/workflows/(build|desktop)\.yml$)'
          # What server/Dockerfile reads (issue #376): server/, and the web
          # client's build inputs its web stage copies by name. Keep this in
          # step with that stage's COPY lines.
          DOCKER_PATHS: '^(server/|src/|public/|index\.html$|vite\.config\.ts$|tsconfig[^/]*\.json$|scripts/vite-shell-worker\.ts$|scripts/check-built-css\.mjs$|package\.json$|package-lock\.json$|\.github/workflows/build\.yml$)'
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BEFORE...$PUSH_AFTER" ;;
            *) range="" ;;
          esac
          # workflow_dispatch, or a push whose "before" isn't a commit we
          # have (all zeros for a new branch, or gone after a force push):
          # there's nothing trustworthy to diff against, so build everything.
          base="${range%%...*}"
          if [ -z "$range" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "no usable diff range; building"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$range")
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE "$BUILD_PATHS"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the bundle depends on changed; skipping build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE "$DOCKER_PATHS"; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the image depends on changed; skipping docker"
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/desktop.yml
    # desktop.yml's bundle job reads the desktop-signing environment's
    # secrets itself; this passes on the repository's.
    secrets: inherit

  # The one check branch protection requires from this workflow. It always
  # runs, so a PR that skipped the build still gets a result. It fails
  # closed: if `changes` itself broke, nothing was proven, so it fails.
  # Builds server/Dockerfile for linux/amd64 without pushing it (issue
  # #376). Only release.yml built the image, so a Dockerfile that stopped
  # building went unnoticed for nine days (#377). One platform is enough to
  # catch a broken copy list or build step; the release builds arm64 too.
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    # About a minute and a half from GitHub's layer cache, longer without it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          file: server/Dockerfile
          build-contexts: |
            client=.
          platforms: linux/amd64
          push: false
          # GitHub's cache, scoped to this job, so a PR that only touches
          # src/ reuses the server stages' layers.
          cache-from: type=gha,scope=docker-ci
          cache-to: type=gha,mode=max,scope=docker-ci

  build-result:
    needs: [changes, build, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: build passed or wasn't needed
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          echo "changes: $CHANGES, build: $BUILD, docker: $DOCKER"
          [ "$CHANGES" = success ] || { echo "the changes job didn't succeed"; exit 1; }
          case "$BUILD" in
            success|skipped) ;;
            *) echo "build $BUILD"; exit 1 ;;
          esac
          case "$DOCKER" in
            success|skipped) ;;
            *) echo "docker $DOCKER"; exit 1 ;;
          esac
