name: build

# M10 step one: prove the Tauri shell + embedded server actually build and
# test clean on macOS and Windows, not just this Linux dev machine. See
# CLAUDE.md's Development Conventions for what M10 covers and what's still
# deliberately deferred (real sidecar packaging, ffmpeg/fpcalc bundling,
# code signing — none of that is this workflow's job).
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .nvmrc is the single source of truth for the Node version — same
      # pin applies to the root app and to server/, which has its own
      # package.json/node_modules and is installed separately below.
      - name: install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # Cargo.toml pins rust-version = "1.77.2" as an MSRV floor, not an
      # exact toolchain version — stable is well above it and is what's
      # actually used on the dev machine (rustc 1.97.x), so stable is what
      # this respects rather than literally installing 1.77.2.
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (branch HEAD, 2026-08-05)

      - name: cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'src-tauri -> target'

      # Tauri's own Linux prerequisites (webkit2gtk, appindicator, rsvg,
      # patchelf for AppImage) plus libasound2-dev, which isn't in Tauri's
      # docs but is required to link cpal/rodio (src-tauri/src/playback.rs)
      # — this dev machine already has it installed, a fresh runner doesn't.
      # ffmpeg is here for the server test suite, not for the app bundle —
      # see the note on that step below.
      - name: install Linux build + test dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            ffmpeg

      # ffmpeg here is a CI test-time dependency only (server/src/waveform/
      # decode.spec.ts shells out to a real ffmpeg to synthesize and decode
      # a test tone) — not app-runtime bundling, which is explicitly a
      # separate, parallel workstream (see PR description).
      - name: install macOS test dependencies
        if: matrix.platform == 'macos-latest'
        run: brew install ffmpeg

      - name: install Windows test dependencies
        if: matrix.platform == 'windows-latest'
        run: choco install ffmpeg -y

      - name: install root dependencies
        run: npm ci

      - name: install server dependencies
        run: npm --prefix server ci

      # better-sqlite3 ships prebuilt native binaries for every platform/arch
      # this matrix touches (darwin-arm64/x64, linux-x64, win32-x64) bundled
      # directly inside its own npm tarball (see lib/binding.js's
      # getPrebuildPath()) — there's no postinstall network fetch and no
      # node-gyp compile happening here, `npm ci` above already resolved it.
      # This step is what actually proves that's true rather than assuming it.
      - name: run server test suite
        run: npm --prefix server test

      - name: cargo clippy (src-tauri)
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      # No tagName/releaseId/releaseName: this deliberately does not create
      # or publish a GitHub Release (out of scope — see PR description).
      # uploadWorkflowArtifacts makes the unsigned bundle downloadable
      # straight from the Actions run instead.
      - name: build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          uploadWorkflowArtifacts: true
