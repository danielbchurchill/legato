name: build

# M10 step one: prove the Tauri shell actually builds and bundles clean on
# macOS and Windows, not just this Linux dev machine. What's deliberately
# deferred (ffmpeg/fpcalc bundling, code signing — none of that is this
# workflow's job).
#
# This is the expensive one — a real 3-platform compile + bundle via
# tauri-action, and macOS/Windows runners bill against GitHub's included-
# minutes quota at 10x/2x the Linux rate. It deliberately does NOT run on
# every push/PR the way check.yml does: the `paths` filters below scope it
# to commits that can actually change what gets compiled or bundled —
# Rust source, the frontend src/ the webview bundles, root deps, and
# server/. Since issue #103 the server ships *inside* the bundle as the
# `legato-server` sidecar (tauri.conf.json's bundle.externalBin), compiled
# by scripts/build-server-sidecar.mjs from beforeBuildCommand, so a
# server/-only change does alter what this job produces. relay/ and site/
# are still separate deployables with their own coverage in check.yml and
# never trigger this. Force a full build regardless of what changed via
# workflow_dispatch (Actions tab -> build -> Run workflow, or
# `gh workflow run build.yml`).
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'scripts/build-server-sidecar.mjs'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
      - 'scripts/build-server-sidecar.mjs'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # Cargo.toml pins rust-version = "1.77.2" as an MSRV floor, not an
      # exact toolchain version — stable is well above it and is what's
      # actually used on the dev machine (rustc 1.97.x), so stable is what
      # this respects rather than literally installing 1.77.2.
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (branch HEAD, 2026-08-05)

      - name: cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'src-tauri -> target'

      # Tauri's own Linux prerequisites (webkit2gtk, appindicator, rsvg,
      # patchelf for AppImage) plus libasound2-dev, which isn't in Tauri's
      # docs but is required to link cpal/rodio (src-tauri/src/playback.rs)
      # — this dev machine already has it installed, a fresh runner doesn't.
      # No ffmpeg here: that was only ever a server/ test-time dependency,
      # and server/'s test suite runs in check.yml now, not this job.
      - name: install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      # Root deps before server deps, and both before tauri-action: the
      # sidecar compile (server/scripts/compile.ts) runs the root
      # `npm run build` itself to embed the web client it serves at / (issue
      # #116), so it needs root node_modules as much as tauri's own
      # beforeBuildCommand does.
      - name: install root dependencies
        run: npm ci

      # beforeBuildCommand runs `npm run build:sidecar`, which compiles the
      # server with `bun build --compile` (issue #103). Same pinned Bun as
      # check.yml and release.yml; scripts/build-server-sidecar.mjs's
      # BUN_VERSION says to bump all three together.
      - name: install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: install server dependencies
        run: npm --prefix server ci

      # Has to come before clippy, not just before tauri-action:
      # tauri-build's build script checks every bundle.externalBin path
      # exists on *every* cargo invocation, so clippy on a fresh runner fails
      # with "resource path `binaries/legato-server-<triple>` doesn't exist"
      # otherwise. tauri-action's beforeBuildCommand compiles it again
      # (no --if-missing there), so the bundle still ships a fresh binary.
      - name: build server sidecar
        run: npm run build:sidecar

      - name: cargo clippy (src-tauri)
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      # No tagName/releaseId/releaseName: this deliberately does not create
      # or publish a GitHub Release (out of scope — see PR description).
      # uploadWorkflowArtifacts makes the unsigned bundle downloadable
      # straight from the Actions run instead.
      - name: build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          uploadWorkflowArtifacts: true
