name: check

# The cheap, always-on safety net: pure Node/TypeScript checks across every
# package in the repo (root app, server/, relay/, site/), Linux-only. No
# Rust toolchain, no Tauri bundling — that's build.yml's job, and it's
# expensive (macOS/Windows runners bill at 10x/2x the Linux rate against
# GitHub's included-minutes quota), so it only runs when something that
# actually affects the native build changed. This job runs on everything,
# every time, because Linux minutes are cheap and this is real regression
# coverage for the four packages that had zero CI coverage between them
# before relay/ and site/ existed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            relay/package-lock.json
            site/package-lock.json

      # ffmpeg is a test-time dependency only — server/src/waveform/
      # decode.spec.ts shells out to a real ffmpeg to synthesize and decode
      # a test tone. Nothing else in this job needs system packages: no
      # Tauri bundling happens here, so none of webkit2gtk/appindicator/
      # rsvg/libasound2/etc are needed (see build.yml for those).
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: install root dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: build root app (tsc -b && vite build)
        run: npm run build

      # The app's own specs (vitest, scoped to src/**/*.spec.{ts,tsx}). Same
      # as `npx vitest run` in check:all, so a red local run is a red CI run.
      - name: app test suite (vitest)
        run: npm test

      # server/ runs on Bun, not Node — issue #100. Dependencies still
      # install via npm (server/package-lock.json stays the source of
      # truth), but `npm --prefix server test` shells out to `bun test`
      # per server/package.json's "test" script, so Bun needs to be on
      # PATH first.
      - name: install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: install server dependencies
        run: npm --prefix server ci

      # Issue #102: the compiled binary embeds every *.sql migration via a
      # generated manifest of static imports (server/src/migrations/
      # manifest.generated.ts) instead of a runtime directory scan, because
      # `bun build --compile` can only embed a file it sees referenced
      # through a real `import`. Regenerating and diffing here means a
      # migration added without a matching `npm --prefix server run
      # generate:migrations` fails this job loudly, instead of shipping a
      # compiled binary that silently applies fewer migrations than exist.
      - name: verify migrations manifest is up to date
        run: |
          npm --prefix server run generate:migrations
          git diff --exit-code -- server/src/migrations/manifest.generated.ts || {
            echo "::error::server/src/migrations/manifest.generated.ts is stale — run 'npm --prefix server run generate:migrations' and commit the result.";
            exit 1;
          }

      # `bun test` strips types without checking them, and the root build's
      # `tsc -b` covers only the app, so server/ needs its own pass (#318).
      - name: type-check server
        run: npm --prefix server run typecheck

      - name: server test suite
        run: npm --prefix server test

      # Issue #102's named risk: a compiled binary has no source tree, so a
      # broken or stale embed would boot clean and just silently have no
      # schema. This compiles one target (matching this runner, so no
      # cross-compile download) and boots it against a brand-new empty
      # data dir to prove migrations actually apply — see
      # server/scripts/check-migration-boot.ts. release.yml runs the same
      # check again at actual release time, against every target it ships.
      - name: compile server (linux-x64-baseline) for the migration boot check
        run: npm --prefix server run compile -- linux-x64-baseline

      - name: migration boot check (compiled binary, empty data dir)
        run: npm --prefix server run check:migration-boot -- dist/linux-x64-baseline/legato-server

      - name: install relay dependencies
        run: npm --prefix relay ci

      - name: relay test suite
        run: npm --prefix relay test

      - name: install site dependencies
        run: npm --prefix site ci

      - name: build site
        run: npm --prefix site run build
