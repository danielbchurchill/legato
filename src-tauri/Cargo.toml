[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "AGPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2"
rodio = "0.22"
ctrlc = { version = "3", features = ["termination"] }
tauri-plugin-autostart = "2"
# Issue #117's connect screen: browsing _legato._tcp (discovery.rs), and the
# custom-address probe's TLS step (probe.rs). Pure Rust on every target; ring
# rather than rustls's default aws-lc-rs, which needs cmake and NASM to build.
mdns-sd = { version = "0.21", default-features = false, features = ["logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# Issue #185: a track whose file isn't on this machine streams from the
# server instead (playback.rs). Blocking, so it fits the prefetch thread that
# already reads files; rustls with ring and the OS verifier, as above.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
# probe.rs's test serves a self-signed certificate to check it's reported
# as untrusted.
rcgen = "0.14"
