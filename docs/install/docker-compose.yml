# Legato server, Docker install (issue #105). See docker.md next to this
# file for the walkthrough. The short version:
#
#   LEGATO_MUSIC_DIR=/path/to/your/music docker compose up -d
#
# then open http://<this machine>:8899/setup, create the owner account, and
# add /music as a library folder. `docker compose logs | grep "setup code"`
# prints the setup code, if the page asks for it.
services:
  legato:
    image: ghcr.io/danielbchurchill/legato-server:latest
    restart: unless-stopped
    environment:
      # The host user that owns your music. `id <user>` on the host prints
      # both numbers. The server runs as this user, never as root.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      # The name Legato's apps show for this server. Without it, they show
      # the container's hostname: a random id on Docker's default network.
      # LEGATO_SERVER_NAME: "Living room"
      # How much disk converted tracks may take, in megabytes. 4 GB without
      # it. See "How much disk the stream cache takes" in docker.md.
      # LEGATO_STREAM_CACHE_MB: "4096"
    ports:
      - "${LEGATO_HOST_PORT:-8899}:8899"
    volumes:
      # Database, cover art, waveform and stream caches. A named volume so it
      # survives `docker compose down` and image upgrades.
      - legato-data:/data
      # Your library, read-only. Legato only ever reads audio files unless
      # you turn on tag write-back, which needs this to be read-write. See
      # "Tag write-back" in docker.md before removing :ro.
      #
      # The :? makes compose stop with that message when the variable is
      # unset. Otherwise Docker would create an empty, root-owned folder at
      # the fallback path and Legato would scan nothing.
      - "${LEGATO_MUSIC_DIR:?set LEGATO_MUSIC_DIR to your music folder, or replace this line with the path}:/music:ro"
      # Away from home, for phones that reach Legato over Tailscale: the
      # host's Tailscale socket folder and its `tailscale` command, so the
      # server can ask whether each device is at home. Both need
      # `network_mode: host` in place of the ports: block above; on Docker's
      # bridge network the server would take a phone at home for one away.
      # See "Away from home, over Tailscale" in docker.md.
      # - /var/run/tailscale:/var/run/tailscale:ro
      # - /usr/bin/tailscale:/usr/local/bin/tailscale:ro

volumes:
  legato-data:
