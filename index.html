<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      #136/D10: sets data-theme on <html> before Tailwind's tokens.css rules
      or React ever run, so a light-mode user never sees a dark first paint.
      Mirrors useTheme.ts's own resolution exactly (same storage key, same
      'system' -> prefers-color-scheme fallback) — keep the two in sync by
      hand if either changes; this one has to stay a plain inline script
      since it must run synchronously, before the stylesheet paints anything.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('legato:theme');
          var pref = stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'system';
          var theme = pref === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref;
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legato</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
