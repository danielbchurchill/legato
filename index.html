<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      #136: sets data-theme on <html> before Tailwind's tokens.css rules
      or React ever run, so a paper user never sees an ink first paint.
      Mirrors useTheme.ts's own resolution exactly (same storage key, same
      'system' -> prefers-color-scheme, same ink when nothing is stored or
      storage is unavailable, #282). useTheme.spec.tsx runs this script to
      check the two agree; it has to stay a plain inline script since it
      must run synchronously, before the stylesheet paints anything.

      #128: it also colours the browser/installed-app chrome to match, via
      the theme-color meta below. The two hexes are tokens.css's
      --color-canvas for each theme, repeated here because tokens.css hasn't
      loaded yet; useTheme.ts reads the token itself from then on.
    -->
    <meta name="theme-color" content="#14181a" />
    <script>
      (function () {
        var theme;
        try {
          var stored = localStorage.getItem('legato:theme');
          var pref = stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'dark';
          theme = pref === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref;
        } catch (e) {
          theme = 'dark';
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f6f4ef' : '#14181a';
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legato</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
